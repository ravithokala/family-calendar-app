<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; img-src 'self' data:">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#3D3A7A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Cal">
<title>Family Calendar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script src="https://accounts.google.com/gsi/client" async></script>
<script type="module" src="app.js"></script>
</head>
<body>
<header>
  <div class="top">
    <h1 id="app-title">Family Calendar</h1>
    <button id="pending" class="badge" type="button" hidden></button>
    <div id="account"></div>
  </div>
  <div id="chrome" hidden>
    <nav id="filters" aria-label="Whose calendar"></nav>
    <div class="nav">
      <button id="prev" class="step" aria-label="Previous">‹</button>
      <h2 id="title"></h2>
      <button id="next" class="step" aria-label="Next">›</button>
      <button id="today-button" class="link">Today</button>
      <button id="print-button" class="link" hidden aria-label="Print this month">🖨 Print</button>
    </div>
  </div>
</header>
<div id="signin"></div>
<main id="main"><p class="muted">Loading…</p></main>
<button id="add" class="fab" aria-label="Add" hidden>+</button>
<nav id="tabs" aria-label="Screens"></nav>
</body>
</html>
